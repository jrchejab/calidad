services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SERVER_NAME=${DOMAIN:-localhost}
      - ENABLE_SSL=true
      - DB_HOST=mysql
      - DB_USER=${MYSQL_USER:-admin}
      - DB_PASSWORD=${MYSQL_PASSWORD:-calidad_password}
      - DB_NAME=${MYSQL_DATABASE:-db_calidad}
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.calidad.rule=Host(`${DOMAIN}`)"
      - "traefik.http.services.calidad.loadbalancer.server.port=80"
      - "traefik.http.routers.calidad.entrypoints=websecure"
      - "traefik.http.routers.calidad.tls=true"
      - "traefik.http.routers.calidad.tls.certresolver=coolify"
      - "traefik.http.routers.calidad-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.calidad-http.entrypoints=web"
      - "traefik.http.routers.calidad-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --sql-mode=""
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-db_calidad}
      - MYSQL_USER=${MYSQL_USER:-admin}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-calidad_password}
    volumes:
      - mysql_data:/var/lib/mysql
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
